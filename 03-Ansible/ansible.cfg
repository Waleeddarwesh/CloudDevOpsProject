# ==============================================================================
# Ansible configuration
# ==============================================================================
# Ansible searches for ansible.cfg in this order and uses the FIRST match:
#   1. $ANSIBLE_CONFIG
#   2. ./ansible.cfg          ← this file, when run from 03-Ansible/
#   3. ~/.ansible.cfg
#   4. /etc/ansible/ansible.cfg
#
# Keeping it beside the playbook means the settings travel with the repository
# and nobody has to remember a long command line.
#
# SECURITY NOTE: Ansible ignores an ansible.cfg in a world-writable directory.
# If you see "Ansible is being run in a world writable directory", fix the
# permissions rather than setting ANSIBLE_CONFIG to bypass the check.
# ==============================================================================

[defaults]

# --- Inventory ---
# Points at the directory, not a single file, so additional sources (a static
# inventory for a local VM, for example) can be dropped in beside aws_ec2.yml
# and merged automatically.
inventory = ./inventory

# --- Connection ---
# Ubuntu AMIs ship with the `ubuntu` user; root login over SSH is disabled.
remote_user = ubuntu
private_key_file = ~/.ssh/ivolve-key.pem

# EC2 instances are created fresh, so their host keys are never in known_hosts
# and a strict check would block every first run. Acceptable here because the
# instance was just created by Terraform in a private VPC.
# For long-lived production hosts, set this back to True.
host_key_checking = False

# --- Privilege escalation ---
# Most tasks install packages and manage systemd units.
become = True
become_method = sudo
become_user = root

# --- Output ---
# The default 'minimal' callback prints an unreadable JSON blob per task.
# 'yaml' formats multi-line output (command stdout, error tracebacks) legibly.
stdout_callback = yaml
# Apply the same formatting to `ansible` ad-hoc commands, not just playbooks.
bin_ansible_callbacks = True

# Show how long each task took — the quickest way to find the slow step in a
# 5-minute playbook run.
callbacks_enabled = timer, profile_tasks

# --- Performance ---
# Run against up to 10 hosts at once. Irrelevant with a single Jenkins server,
# but correct if the inventory later grows.
forks = 10

# Fact gathering hits every host on every run. Caching facts in a local JSON
# store makes repeat runs noticeably faster.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ./.ansible_facts
fact_caching_timeout = 3600

# --- Vault ---
# Path to the file holding the vault password. Gitignored — see
# .vault_pass.example. Without this, every run needs --ask-vault-pass.
vault_password_file = ./.vault_pass

# --- Noise reduction ---
deprecation_warnings = True
interpreter_python = auto_silent
# Skip the "[WARNING]: Platform linux on host ... is using the discovered Python
# interpreter" banner on every task.

# Log every run to a file for post-mortem debugging.
log_path = ./ansible.log

[inventory]
# The aws_ec2 plugin is not enabled by default. Without this line, inventory/
# aws_ec2.yml is silently ignored and the play reports "skipping: no hosts
# matched" — a confusing failure with no obvious cause.
enable_plugins = amazon.aws.aws_ec2, ini, yaml

# Turn an unparsable inventory source into a hard error instead of a warning.
unparsed_is_failed = True

[ssh_connection]
# ControlPersist keeps one SSH connection open and multiplexes every subsequent
# task over it, instead of a fresh TCP + TLS handshake per task. Typically cuts
# playbook runtime by 30-50%.
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30 -o PreferredAuthentications=publickey

# Pipelining sends the module code over the existing SSH session rather than
# writing a temporary file to the remote host first — one fewer round trip per
# task. Requires `requiretty` to be disabled in the remote sudoers, which is
# already the case on Ubuntu cloud images.
pipelining = True

# Where Ansible stages module files on the control node.
control_path_dir = ~/.ansible/cp

# Retry a failed SSH connection once — cloud instances occasionally refuse the
# first connection while sshd is still starting.
retries = 3
