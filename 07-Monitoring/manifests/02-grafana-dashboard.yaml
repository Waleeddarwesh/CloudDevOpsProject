# ==============================================================================
# Grafana dashboard, delivered as a ConfigMap
# ==============================================================================
# The Grafana sidecar (enabled in kube-prometheus-stack-values.yaml under
# grafana.sidecar.dashboards) watches for ConfigMaps carrying the label
#     grafana_dashboard: "1"
# and imports their contents automatically.
#
# This is what makes dashboards VERSION-CONTROLLED. A dashboard built by
# clicking around the Grafana UI lives only in Grafana's database — it is lost
# on a reinstall, cannot be code-reviewed, and cannot be promoted from dev to
# prod. Storing the JSON in Git and letting the sidecar load it means the
# dashboard is treated like any other piece of infrastructure.
#
# Apply with:
#     kubectl apply -f 07-Monitoring/manifests/02-grafana-dashboard.yaml
#
# The sidecar picks it up within ~60 seconds; no Grafana restart is needed.
#
# NOTE: this file is GENERATED from dashboards/ivolve-overview.json.
# Edit that file and re-run `make grafana-dashboard`, rather than editing the
# embedded copy below.
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: ivolve-overview-dashboard
  namespace: monitoring
  labels:
    # The label the sidecar selects on. Without it the ConfigMap is created
    # successfully and simply ignored.
    grafana_dashboard: "1"
    app.kubernetes.io/name: ivolve-dashboard
    app.kubernetes.io/part-of: ivolve
data:
  ivolve-overview.json: |
    {
      "title": "iVolve — Application Overview",
      "uid": "ivolve-overview",
      "tags": ["ivolve", "capstone"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "Prometheus" }
          },
          {
            "name": "namespace",
            "type": "constant",
            "query": "ivolve",
            "current": { "text": "ivolve", "value": "ivolve" },
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Service Availability (black-box probes)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Service Up/Down",
          "description": "probe_success from the blackbox-exporter. 1 = HTTP 2xx, 0 = failing. This is what a user actually experiences.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 1 },
          "targets": [
            {
              "expr": "probe_success{service=~\"frontend|auth-service|roadmap-service\"}",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "index": 0 }, "1": { "text": "UP", "index": 1 } } }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Response Time (p50 over probe interval)",
          "description": "probe_duration_seconds. A rising trend here is the earliest signal of a saturation problem.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 6, "w": 16, "x": 8, "y": 1 },
          "targets": [
            {
              "expr": "probe_duration_seconds{service=~\"frontend|auth-service|roadmap-service\"}",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 2 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "row",
          "title": "Workload Health (kube-state-metrics)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 7 }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Replicas: desired vs available",
          "description": "A persistent gap means pods cannot start — check for Pending pods or failing readiness probes.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "kube_deployment_spec_replicas{namespace=\"$namespace\"}",
              "legendFormat": "{{deployment}} desired",
              "refId": "A"
            },
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"$namespace\"}",
              "legendFormat": "{{deployment}} available",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 0, "showPoints": "auto" }
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Container restarts (15m rate)",
          "description": "Anything sustained above zero is a crash loop. Investigate with: kubectl logs -n ivolve <pod> --previous",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "rate(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[15m]) * 900",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 60 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 20,
          "type": "row",
          "title": "Resource Usage (cAdvisor)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 15 }
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "CPU usage vs limit",
          "description": "Usage approaching the limit line means throttling is imminent.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", container!=\"\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 15, "stacking": { "mode": "none" } }
            },
            "overrides": []
          }
        },
        {
          "id": 22,
          "type": "timeseries",
          "title": "Memory working set",
          "description": "container_memory_working_set_bytes is the value the kernel OOM-killer compares against the limit — not RSS, and not cache.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\", container!=\"\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 15 }
            },
            "overrides": []
          }
        },
        {
          "id": 23,
          "type": "timeseries",
          "title": "CPU throttling ratio",
          "description": "The percentage of scheduling periods in which the container was throttled. Invisible on a CPU-usage graph — a throttled container shows LOW usage precisely because it is being stopped.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 23 },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"$namespace\"}[5m])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"$namespace\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "max": 1,
              "min": 0,
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 20 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.1 },
                  { "color": "red", "value": 0.25 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 24,
          "type": "timeseries",
          "title": "MySQL PVC free space",
          "description": "The alert rule uses predict_linear over this series to warn 4 days before it fills.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 23 },
          "targets": [
            {
              "expr": "kubelet_volume_stats_available_bytes{namespace=\"$namespace\"}",
              "legendFormat": "{{persistentvolumeclaim}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 15 }
            },
            "overrides": []
          }
        },
        {
          "id": 30,
          "type": "row",
          "title": "Nodes (node-exporter DaemonSet)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 30 }
        },
        {
          "id": 31,
          "type": "timeseries",
          "title": "Node CPU utilisation",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 31 },
          "targets": [
            {
              "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "max": 1,
              "min": 0,
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 15 }
            },
            "overrides": []
          }
        },
        {
          "id": 32,
          "type": "timeseries",
          "title": "Node memory utilisation",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 31 },
          "targets": [
            {
              "expr": "1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "max": 1,
              "min": 0,
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 15 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "red", "value": 0.9 }
                ]
              }
            },
            "overrides": []
          }
        }
      ]
    }
